services:
  heartbeat:
    image: busybox:1.37
    command: ["sh", "-c", "while true; do printf '[heartbeat] %s\\n' \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"; sleep 3600; done"]
    depends_on:
      - windows
    restart: unless-stopped

  windows:
    image: dockurr/windows
    container_name: windows

    environment:
      VERSION: "10"
      USERNAME: ${WINDOWS_USERNAME}
      PASSWORD: ${WINDOWS_PASSWORD}
      AUTOLOGIN: "N"
      RAM_SIZE: "8G"
      CPU_CORES: "4"
      AUDIO: "Y"

    network_mode: bridge

    cap_add:
      - NET_ADMIN

    ports:
      - "8006:8006"
      - "3389:3389/tcp"

    volumes:
      - ./windows-data:/storage

    devices:
      - "/dev/kvm:/dev/kvm"
      - "/dev/net/tun:/dev/net/tun"

    stop_grace_period: 2m
    restart: always
